name: codehub

# Services the checks run against: `make ci` starts them (make services) and
# stops them (make services-down). Host ports sit below the Linux ephemeral
# range and away from the defaults (5432, 9000, 8080).
#   postgres  15432
#   s3        19000   (MinIO)
#   dex       18080
#   keycloak  18081   (second identity provider: introspection, token exchange)
#   cerbos    18082   (AuthZEN 1.0 decision point, policy in dev/cerbos/policies)
#
# Images are pinned by digest (tag kept for the reader). Mover: Dependabot's
# docker-compose updates (.github/dependabot.yml), merged by the PM. The s3 image
# is Chainguard's MinIO build, the only maintained image that pulls: its tag is
# only `latest`, older digests stay pullable (checked 2026-11-11).
services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_USER: codehub
      POSTGRES_PASSWORD: codehub
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codehub"]
      interval: 1s
      timeout: 3s
      retries: 60

  s3:
    image: cgr.dev/chainguard/minio:latest@sha256:db3f583fa49121942168bd6383a773b2cde3384c9a99bf7193560b9a0f3a28fd
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: codehub-test-access
      MINIO_ROOT_PASSWORD: codehub-test-secret-key
    ports:
      - "127.0.0.1:19000:9000"
    # The image has no shell or client to probe with; scripts/services-up.sh
    # waits on /minio/health/ready from the host.

  dex:
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dev/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:18080:5556"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5558/healthz/ready"]
      interval: 1s
      timeout: 3s
      retries: 60

  # Development mode, with the realm of dev/keycloak imported at start. The image has no shell or
  # curl to probe with; scripts/services-up.sh waits on the discovery document from the host.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://127.0.0.1:18081
    volumes:
      - ./dev/keycloak/codehub-realm.json:/opt/keycloak/data/import/codehub-realm.json:ro
    ports:
      - "127.0.0.1:18081:8080"

  # An AuthZEN 1.0 decision point (Access Evaluation at /access/v1/evaluation, HTTP on 3592). It
  # holds no authentication of its own: the adapter's bearer token is presented and not verified.
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.57.0@sha256:e5e3b150b3cb0090975605254f255164567d67e233634199fb20972e3eaff300
    command:
      - server
      - --set=storage.driver=disk
      - --set=storage.disk.directory=/policies
      - --set=storage.disk.watchForChanges=false
    environment:
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - ./dev/cerbos/policies:/policies:ro
    ports:
      - "127.0.0.1:18082:3592"
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--kind=http"]
      interval: 1s
      timeout: 3s
      retries: 60
