name: codehub

# Services the checks run against: `make ci` starts them (make services) and
# stops them (make services-down). Credentials come from dev/test.env, which
# the Makefile passes with --env-file; without make, run
# `docker compose --env-file dev/test.env up --detach --wait --wait-timeout 180`.
# Every service is healthy, and the bucket exists, when that returns. Host ports sit below the Linux ephemeral
# range and away from the defaults (5432, 9000, 8080).
#   postgres  15432
#   s3        19000   (MinIO)
#   dex       18080
#   keycloak  18081   (second identity provider: introspection, token exchange)
#   cerbos    18082   (AuthZEN 1.0 decision point, policy in dev/cerbos/policies)
#   registry  18083   (profile `registry`, below: not part of the services above)
#
# The profile `pg-modes` is a primary with a hot standby and PgBouncer, for `make test-pg-modes`; it
# runs as its own project (CODEHUB_PG_MODES_PROJECT), because its test stops the primary.
#   pg-primary  15440
#   pg-standby  15441
#   pgbouncer   15442   (transaction mode, in front of pg-primary)
#
# The services after the check services are the profile `garam`: garam as codehub's OIDC issuer
# and AuthZEN decision point, from garam's published images, for `make e2e-garam`. None starts
# without the profile. Only the garam-e2e workflow may pull the server and policy images (ECR, OIDC
# role), so they carry `pull_policy: never`; it pulls them with
# `docker compose --profile garam pull --policy missing migrate policy-migrate`. The profile runs
# as its own project (CODEHUB_GARAM_E2E_PROJECT), so taking it down leaves the services above up,
# and is named by the service that readies it all, gateway. Its addresses are in dev/test.env; the
# directory of keys (CODEHUB_GARAM_E2E_DIR, made by the e2e example garam_keys) and the host user
# (CODEHUB_GARAM_E2E_USER) are set by `make e2e-garam` alone; the directory defaults to `.` so the
# file validates without it, which compose requires of services whose profile is off.
#
# The services registry-bucket and registry are the profile `registry`: Distribution v3, the image
# registry of ADR 0053, in the same project as the services above and starting after them, for the
# e2e test e2e/tests/registry.rs (`make e2e`). None starts without the profile, and
# `docker compose --profile registry up --detach --wait --no-recreate registry` adds the two
# without recreating any other service. The registry stores in the object store above under the
# bucket CODEHUB_TEST_REGISTRY_BUCKET and trusts the tokens whose public key is in
# registry-jwks.json of the directory CODEHUB_REGISTRY_E2E_DIR (made by the e2e example garam_keys;
# set by `make e2e`, defaulting to `.` so the file validates without it). Its token realm
# is the codehub the test starts on CODEHUB_TEST_REGISTRY_REALM_PORT.
#
# Images are pinned by digest (tag kept for the reader). Mover: Dependabot's
# docker-compose updates (.github/dependabot.yml), merged by the PM. The s3 image
# is Chainguard's MinIO build, the only maintained image that pulls: its tag is
# only `latest`, older digests stay pullable (checked 2026-11-11). The garam images are the ones
# recorded for garam 0.8.0 (release v0.8.0 at garamsh/garam 2a4d987842899c43e18bf4904a79a6d346d20b73)
# in https://github.com/garamsh/codehub/issues/137#issuecomment-6842874033; their mover is the PM,
# when garam releases. The PostgreSQL image of the profile is the one garam's own stack pins.
#
# Only the garam services (server and policy) run as the host's user, so the keys they read stay
# mode 0600 on the host; the PostgreSQL and Caddy containers do not, except the one that writes the
# issuer's keys beside them.
x-server: &server
  image: 486152169996.dkr.ecr.ap-northeast-2.amazonaws.com/garam/server:0.8.0@sha256:898c44f06b6514525fb2c015135aa123bf086388a0b5d7ec37244b0daa7f21c7
  user: "${CODEHUB_GARAM_E2E_USER:-}"
  pull_policy: never
  profiles: [garam]

x-policy: &policy
  image: 486152169996.dkr.ecr.ap-northeast-2.amazonaws.com/garam/policy:0.8.0@sha256:99e70651587666430e8bc9b7d8a3d459d04927c51a992c313173a816e2856936
  user: "${CODEHUB_GARAM_E2E_USER:-}"
  pull_policy: never
  profiles: [garam]

x-garam-postgres: &garam-postgres
  image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
  profiles: [garam]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U garam"]
    interval: 2s
    timeout: 5s
    retries: 10
    start_period: 60s

# garam requires its issuer identifier to be an https URL with the path /api.
x-issuer: &issuer https://localhost:${CODEHUB_GARAM_E2E_GATEWAY_PORT:-}/api

x-api-environment: &api-environment
  GARAM_DATABASE_URL: postgres://garam:garam@garam-postgres:5432/garam?sslmode=disable
  GARAM_HTTP_ADDR: ":8080"
  GARAM_AUTHZ_ADDR: authz:9090
  GARAM_COOKIE_SECURE: "false"
  GARAM_IDENTITY_ISSUER: *issuer
  GARAM_POLICY_TOKEN_ISSUER: *issuer
  GARAM_POLICY_SIGNING_KEY_FILE: /keys/signing.pem
  GARAM_IDENTITY_SERVICE_KEYS_FILE: /keys/service-keys.json
  GARAM_POLICY_ADDR: policy:8443
  GARAM_POLICY_CA_FILE: /keys/ca.crt
  GARAM_MACHINE_TOKEN_URL: https://machine:8443/oauth/token

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_USER: ${CODEHUB_TEST_POSTGRES_USER:?set from dev/test.env}
      POSTGRES_PASSWORD: ${CODEHUB_TEST_POSTGRES_PASSWORD:?set from dev/test.env}
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 3s
      retries: 60

  s3:
    image: cgr.dev/chainguard/minio:latest@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${CODEHUB_TEST_S3_ACCESS_KEY:?set from dev/test.env}
      MINIO_ROOT_PASSWORD: ${CODEHUB_TEST_S3_SECRET_KEY:?set from dev/test.env}
      MC_HOST_local: http://${CODEHUB_TEST_S3_ACCESS_KEY}:${CODEHUB_TEST_S3_SECRET_KEY}@127.0.0.1:9000
    ports:
      - "127.0.0.1:19000:9000"
    # The image carries the MinIO client; `mc ready` asks the server's own readiness endpoint.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 3s
      retries: 60

  # One-shot: creates the bucket once the store is ready, then exits 0. The store has no setting
  # that creates a bucket, so the image's own client does it.
  s3-init:
    image: cgr.dev/chainguard/minio:latest@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/${CODEHUB_TEST_S3_BUCKET:?set from dev/test.env}"]
    environment:
      MC_HOST_local: http://${CODEHUB_TEST_S3_ACCESS_KEY}:${CODEHUB_TEST_S3_SECRET_KEY}@s3:9000
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  # Compose 5.7.0 treats a one-shot container that exited 0 as a failed `up --wait` unless a
  # service depends on it with service_completed_successfully. This service holds that dependency
  # and is healthy once the bucket is readable.
  s3-ready:
    image: cgr.dev/chainguard/minio:latest@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    entrypoint: ["sleep", "infinity"]
    environment:
      MC_HOST_local: http://${CODEHUB_TEST_S3_ACCESS_KEY}:${CODEHUB_TEST_S3_SECRET_KEY}@s3:9000
    depends_on:
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mc", "stat", "local/${CODEHUB_TEST_S3_BUCKET}"]
      interval: 1s
      timeout: 3s
      retries: 60

  dex:
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dev/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:18080:5556"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5558/healthz/ready"]
      interval: 1s
      timeout: 3s
      retries: 60

  # Development mode, with the realm of dev/keycloak imported at start. The image has bash and no
  # curl, so the healthcheck sends the request over bash's /dev/tcp to the management port's
  # readiness endpoint.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://127.0.0.1:18081
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./dev/keycloak/codehub-realm.json:/opt/keycloak/data/import/codehub-realm.json:ro
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s

  # An AuthZEN 1.0 decision point (Access Evaluation at /access/v1/evaluation, HTTP on 3592). It
  # holds no authentication of its own: the adapter's bearer token is presented and not verified.
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.57.0@sha256:e5e3b150b3cb0090975605254f255164567d67e233634199fb20972e3eaff300
    command:
      - server
      - --set=storage.driver=disk
      - --set=storage.disk.directory=/policies
      - --set=storage.disk.watchForChanges=false
    environment:
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - ./dev/cerbos/policies:/policies:ro
    ports:
      - "127.0.0.1:18082:3592"
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--kind=http"]
      interval: 1s
      timeout: 3s
      retries: 60

  # The profile `pg-modes` starts here: a primary, a hot standby that follows it, and PgBouncer
  # in front of the primary, for `make test-pg-modes` (ADR 0054). The primary commits only once the
  # standby has flushed, so a landing the server acknowledged is on the standby that is promoted.
  pg-primary:
    image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    profiles: [pg-modes]
    environment:
      POSTGRES_USER: ${CODEHUB_TEST_POSTGRES_USER:?set from dev/test.env}
      POSTGRES_PASSWORD: ${CODEHUB_TEST_POSTGRES_PASSWORD:?set from dev/test.env}
      POSTGRES_DB: codehub
    volumes:
      - ./dev/pg-modes/primary-init.sh:/docker-entrypoint-initdb.d/primary-init.sh:ro
    ports:
      - "127.0.0.1:15440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 3s
      retries: 60

  pg-standby:
    image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    profiles: [pg-modes]
    user: postgres
    entrypoint: ["/bin/sh", "/pg-modes/standby.sh"]
    environment:
      POSTGRES_USER: ${CODEHUB_TEST_POSTGRES_USER:?set from dev/test.env}
    volumes:
      - ./dev/pg-modes/standby.sh:/pg-modes/standby.sh:ro
    ports:
      - "127.0.0.1:15441:5432"
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 3s
      retries: 60

  # Transaction pooling, as a managed pooler runs. It ignores the startup option codehub sets the
  # statement timeout with, and tracks the prepared statements of its clients
  # (`MAX_PREPARED_STATEMENTS`), which the named statements of sqlx need. Set to 0 the landings
  # fail: sqlx sends the Parse and the Bind of a statement in separate rounds (ADR 0054).
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0@sha256:4a8371e79d6627e74f553d0aaa8e4c5ace20e30034fb296e569b71c89c99e108
    profiles: [pg-modes]
    environment:
      DATABASE_URL: postgres://${CODEHUB_TEST_POSTGRES_USER:-}:${CODEHUB_TEST_POSTGRES_PASSWORD:-}@pg-primary:5432/codehub
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_PREPARED_STATEMENTS: "100"
      DEFAULT_POOL_SIZE: "10"
      MAX_CLIENT_CONN: "200"
      IGNORE_STARTUP_PARAMETERS: options,extra_float_digits
    ports:
      - "127.0.0.1:15442:6432"
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 1s
      timeout: 3s
      retries: 60

  # One-shot: creates the registry's bucket, a bucket of its own, once the store is ready, then
  # exits 0. The registry waits for it, which also satisfies the compose rule noted at s3-ready.
  registry-bucket:
    image: cgr.dev/chainguard/minio:latest@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/${CODEHUB_TEST_REGISTRY_BUCKET:?set from dev/test.env}"]
    environment:
      MC_HOST_local: http://${CODEHUB_TEST_S3_ACCESS_KEY}:${CODEHUB_TEST_S3_SECRET_KEY}@s3:9000
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"
    profiles: [registry]

  # Distribution v3.1.2 (released 2026-09-24, the latest stable; GHSA-685w-q87j-wqw3, the newest
  # advisory of the project, is patched in it). The configuration is dev/registry/config.yml with
  # the settings of this environment as REGISTRY_* variables, which override it.
  registry:
    image: ghcr.io/distribution/distribution:3.1.2@sha256:d106962e6fe3fa69c178cec77eeeee5edb626b8df6535b7bd6b95e658a0a5ca9
    environment:
      REGISTRY_STORAGE_S3_BUCKET: ${CODEHUB_TEST_REGISTRY_BUCKET:?set from dev/test.env}
      REGISTRY_STORAGE_S3_REGION: ${CODEHUB_TEST_S3_REGION:?set from dev/test.env}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: http://s3:9000
      REGISTRY_STORAGE_S3_ACCESSKEY: ${CODEHUB_TEST_S3_ACCESS_KEY:?set from dev/test.env}
      REGISTRY_STORAGE_S3_SECRETKEY: ${CODEHUB_TEST_S3_SECRET_KEY:?set from dev/test.env}
      REGISTRY_AUTH_TOKEN_REALM: http://127.0.0.1:${CODEHUB_TEST_REGISTRY_REALM_PORT:?set from dev/test.env}/v1/registry/token
      REGISTRY_AUTH_TOKEN_SERVICE: ${CODEHUB_TEST_REGISTRY_SERVICE:?set from dev/test.env}
      REGISTRY_AUTH_TOKEN_ISSUER: ${CODEHUB_TEST_REGISTRY_ISSUER:?set from dev/test.env}
      REGISTRY_AUTH_TOKEN_JWKS: /keys/registry-jwks.json
    volumes:
      - ./dev/registry/config.yml:/etc/distribution/config.yml:ro
      - ${CODEHUB_REGISTRY_E2E_DIR:-.}/registry-jwks.json:/keys/registry-jwks.json:ro
    ports:
      - "127.0.0.1:18083:5000"
    depends_on:
      registry-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5001/debug/health"]
      interval: 1s
      timeout: 3s
      retries: 60
    profiles: [registry]

  # The profile `garam` starts here.
  garam-postgres:
    <<: *garam-postgres
    environment:
      POSTGRES_USER: garam
      POSTGRES_PASSWORD: garam
      POSTGRES_DB: garam

  policy-postgres:
    <<: *garam-postgres
    environment:
      POSTGRES_USER: garam
      POSTGRES_PASSWORD: garam
      POSTGRES_DB: policy

  migrate:
    <<: *server
    command: ["migrate"]
    environment:
      GARAM_DATABASE_URL: postgres://garam:garam@garam-postgres:5432/garam?sslmode=disable
    depends_on:
      garam-postgres:
        condition: service_healthy
    restart: "no"

  authz:
    <<: *server
    command: ["serve", "authz"]
    environment:
      GARAM_DATABASE_URL: postgres://garam:garam@garam-postgres:5432/garam?sslmode=disable
      GARAM_GRPC_ADDR: ":9090"
      GARAM_METRICS_ADDR: ":9091"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/garam", "probe", "http://127.0.0.1:9091/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    <<: *server
    command: ["serve", "api"]
    environment: *api-environment
    volumes:
      - ${CODEHUB_GARAM_E2E_DIR:-.}:/keys:ro
    depends_on:
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/garam", "probe", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  machine:
    <<: *server
    command: ["serve", "machine"]
    environment:
      GARAM_DATABASE_URL: postgres://garam:garam@garam-postgres:5432/garam?sslmode=disable
      GARAM_AUTHZ_ADDR: authz:9090
      GARAM_MACHINE_ADDR: ":8443"
      GARAM_MACHINE_HEALTH_ADDR: ":8444"
      GARAM_MACHINE_TLS_CERT_FILE: /keys/tls.crt
      GARAM_MACHINE_TLS_KEY_FILE: /keys/tls.key
      GARAM_MACHINE_SERVER_ROOT_FILE: /keys/ca.crt
      GARAM_CA_KEY_FILE: /keys/kek.hex
      GARAM_MACHINE_ISSUER: https://machine:8443
      GARAM_MACHINE_TOKEN_URL: https://machine:8443/oauth/token
      GARAM_IDENTITY_ISSUER: *issuer
      GARAM_POLICY_SIGNING_KEY_FILE: /keys/signing.pem
      GARAM_IDENTITY_SERVICE_KEYS_FILE: /keys/service-keys.json
    ports:
      - "127.0.0.1:${CODEHUB_GARAM_E2E_MACHINE_PORT:-}:8443"
    volumes:
      - ${CODEHUB_GARAM_E2E_DIR:-.}:/keys:ro
    depends_on:
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/garam", "probe", "http://127.0.0.1:8444/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  policy-migrate:
    <<: *policy
    command: ["migrate"]
    environment:
      POLICY_DATABASE_URL: postgres://garam:garam@policy-postgres:5432/policy?sslmode=disable
    depends_on:
      policy-postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: the policy service trusts the keys the running api publishes, so this writes them
  # beside the other keys once the api is ready, and the policy service starts after it. It asks
  # the api on its own port, where the gateway would strip the /api the api is served under.
  issuer-jwks:
    image: mirror.gcr.io/library/caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: [garam]
    user: "${CODEHUB_GARAM_E2E_USER:-}"
    entrypoint: ["wget", "-T", "10", "-q", "-O", "/keys/issuer-jwks.json", "http://api:8080/oauth/jwks"]
    volumes:
      - ${CODEHUB_GARAM_E2E_DIR:-.}:/keys
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  policy:
    <<: *policy
    command: ["serve"]
    environment:
      POLICY_ADDR: 0.0.0.0:8443
      POLICY_HEALTH_ADDR: 0.0.0.0:8091
      POLICY_DATABASE_URL: postgres://garam:garam@policy-postgres:5432/policy?sslmode=disable
      POLICY_TOKEN_ISSUER: *issuer
      POLICY_JWKS_FILE: /keys/issuer-jwks.json
      POLICY_TLS_CERT_FILE: /keys/tls.crt
      POLICY_TLS_KEY_FILE: /keys/tls.key
    ports:
      - "127.0.0.1:${CODEHUB_GARAM_E2E_POLICY_PORT:-}:8443"
    volumes:
      - ${CODEHUB_GARAM_E2E_DIR:-.}:/keys:ro
    depends_on:
      policy-migrate:
        condition: service_completed_successfully
      issuer-jwks:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/policy", "probe", "http://127.0.0.1:8091/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  # One-shot, with the api's settings: starts the feed of policy entities once the policy service
  # is ready.
  policy-feed:
    <<: *server
    command: ["policy-feed", "start"]
    environment: *api-environment
    volumes:
      - ${CODEHUB_GARAM_E2E_DIR:-.}:/keys:ro
    depends_on:
      policy:
        condition: service_healthy
    restart: "no"

  # garam requires its issuer identifier to be an https URL with the path /api, and codehub
  # fetches the discovery document and the keys from it, so the api is served there. The route
  # strips /api as a deployment's gateway does. Every other service of the profile is one it
  # depends on, directly or through another, so `up --wait gateway` readies the profile. It waits
  # for policy-feed because compose 5.7.0 treats a one-shot that exited 0 as a failed `up --wait`
  # unless a service depends on it with service_completed_successfully.
  gateway:
    image: mirror.gcr.io/library/caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: [garam]
    volumes:
      - ./dev/garam/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CODEHUB_GARAM_E2E_DIR:-.}:/keys:ro
    environment:
      CODEHUB_GARAM_E2E_GATEWAY_PORT: ${CODEHUB_GARAM_E2E_GATEWAY_PORT:-}
    ports:
      - "127.0.0.1:${CODEHUB_GARAM_E2E_GATEWAY_PORT:-}:${CODEHUB_GARAM_E2E_GATEWAY_PORT:-}"
    depends_on:
      machine:
        condition: service_healthy
      policy-feed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:$${CODEHUB_GARAM_E2E_GATEWAY_PORT}/api/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10
