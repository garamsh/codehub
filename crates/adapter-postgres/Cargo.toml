[package]
name = "adapter-postgres"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
app = { path = "../app" }
async-trait.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
adapter-memory = { path = "../adapter-memory" }
adapter-toml = { path = "../adapter-toml" }
test-support = { path = "../test-support" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
