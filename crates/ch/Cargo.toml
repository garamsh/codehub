[package]
name = "ch"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
clap = { workspace = true, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
ignore.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
adapter-http = { path = "../adapter-http" }
adapter-memory = { path = "../adapter-memory" }
adapter-oidc = { path = "../adapter-oidc" }
adapter-s3 = { path = "../adapter-s3" }
app = { path = "../app" }
axum = { workspace = true, features = ["http1", "tokio"] }
test-support = { path = "../test-support" }
tokio = { workspace = true, features = ["macros", "net", "process", "rt"] }

[lints]
workspace = true
