[package]
name = "loadtest"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
clap = { workspace = true, features = ["derive", "error-context", "help", "std", "usage"] }
reqwest = { workspace = true, features = ["form", "json"] }
rusty-s3.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
