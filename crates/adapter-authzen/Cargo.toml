[package]
name = "adapter-authzen"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
app = { path = "../app" }
oauth-client = { path = "../oauth-client" }
reqwest = { workspace = true, features = ["form", "json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs", "use_pem"] }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "sync"] }

[lints]
workspace = true
