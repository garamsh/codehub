# A new cluster restored from the backup of `pg` in the object store.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-restored
spec:
  instances: 3
  storage:
    size: 1Gi
  bootstrap:
    recovery:
      source: pg
      # Stop at the end of the base backup. Without a target the recovery replays every archived WAL
      # segment, so the restored database would hold the landings made after the backup whose objects
      # the backup bucket does not have, and the drill would count them as dangling.
      recoveryTarget:
        targetImmediate: true
        backupID: BACKUP_ID  # the script puts the barman id of backup/pg-drill here
      database: codehub
      owner: codehub
      secret:
        name: pg-app-user
  externalClusters:
    - name: pg
      barmanObjectStore:
        destinationPath: s3://cnpg-backups/
        endpointURL: http://minio:9000
        s3Credentials:
          accessKeyId: {name: minio-credentials, key: rootUser}
          secretAccessKey: {name: minio-credentials, key: rootPassword}
