# The cluster of the fault runs: one control plane and four workers, so three database instances,
# the object store's four servers and the replicas of every role find nodes of their own.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
  - role: worker
