{{- if .Values.migrate.enabled }}
{{- $url := ternary .Values.postgres.migrateUrlSecret .Values.postgres.urlSecret (not (empty .Values.postgres.migrateUrlSecret.name)) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "codehub.fullname" . }}-migrate
  labels:
    {{- include "codehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "codehub.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "codehub.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [migrate]
          env:
            {{- include "codehub.secretEnv" (dict "name" "CODEHUB_POSTGRES_URL" "secret" $url "what" "postgres.urlSecret") | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
