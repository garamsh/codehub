{{- /*
The Gateway API counterpart of ingress.yaml: the runner routes to runner-api, the rest of /v1/ to
api, and /v2/ to the registry. Nothing outside /v1/ and /v2/ is routed, so /metrics, /healthz and
/readyz, which the api serves unauthenticated beside /v1/, stay inside the cluster. The registry has
its own host, so its route has its own switch.
*/ -}}
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "codehub.fullname" . }}
  labels:
    {{- include "codehub.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "codehub.nonEmpty" (dict "value" .Values.httpRoute.parentRefs "what" "httpRoute.parentRefs") | nindent 4 }}
  hostnames:
    {{- include "codehub.nonEmpty" (dict "value" .Values.httpRoute.hostnames "what" "httpRoute.hostnames") | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/runner/}
      backendRefs:
        - name: {{ include "codehub.fullname" . }}-runner-api
          port: {{ .Values.runnerApi.service.port }}
    - matches:
        - path: {type: PathPrefix, value: /v1/}
      backendRefs:
        - name: {{ include "codehub.fullname" . }}-api
          port: {{ .Values.api.service.port }}
{{- end }}
{{- if and .Values.registry.enabled .Values.registry.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "codehub.fullname" . }}-registry
  labels:
    {{- include "codehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  parentRefs:
    {{- include "codehub.nonEmpty" (dict "value" .Values.httpRoute.parentRefs "what" "httpRoute.parentRefs") | nindent 4 }}
  hostnames:
    {{- include "codehub.nonEmpty" (dict "value" .Values.registry.httpRoute.hostnames "what" "registry.httpRoute.hostnames") | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v2/}
      backendRefs:
        - name: {{ include "codehub.fullname" . }}-registry
          port: {{ .Values.registry.service.port }}
{{- end }}
