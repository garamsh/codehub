[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
imara-diff = { version = "0.2.0", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
rusty-s3 = { version = "0.11.0", default-features = false, features = ["rustcrypto"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tower = { version = "0.5.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
