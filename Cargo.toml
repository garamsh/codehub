[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
imara-diff = { version = "0.2.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusty-s3 = { version = "0.11.0", default-features = false, features = ["rustcrypto"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
