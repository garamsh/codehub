[workspace]
members = ["crates/*", "e2e"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
async-trait = "0.1.92"
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ignore = { version = "0.4.25", default-features = false }
gix-imara-diff = { version = "0.3.3", default-features = false, features = ["unified_diff"] }
jsonwebtoken = { version = "11.1.0", default-features = false }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
metrics-util = { version = "0.20.4", default-features = false }
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-http = { version = "0.33.1", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "http-json", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13.5", default-features = false }
rustix = { version = "1.1.6", default-features = false }
rusty-s3 = { version = "0.12.0", default-features = false, features = ["rustcrypto"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false }
tokio = { version = "1.54.1", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["parse", "std"] }
tower = { version = "0.5.3", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "registry", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Line tables keep backtraces and panic locations; the variable and type information a debugger
# reads is not built, which shortens each compile and link and shrinks the target directory the
# CI cache stores. The test profile inherits it.
[profile.dev]
debug = "line-tables-only"
