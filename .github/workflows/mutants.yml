name: mutants

# Never on pull requests: a run takes hours, so it is split into four shards (numbered 0 to 3,
# as cargo-mutants numbers them) that run at once.
# A surviving mutant or a timeout fails its shard.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  mutants:
    # Mover: the .github/ owner in CODEOWNERS (@sauce-git) moves this label when a newer versioned label is published.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Record runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mover: Dependabot's github-actions updates (.github/dependabot.yml) for the action; the
      # .github/ owner in CODEOWNERS (@sauce-git) for the cargo-mutants version, which the action
      # checks against the checksum it records. nextest is installed at its latest, as in ci.yml.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest,cargo-mutants@27.1.0
      # Mover: Dependabot's github-actions updates (.github/dependabot.yml), merged by the PM. The
      # key adds the root manifest whole, as in ci.yml: the action's own key does not hash the
      # profiles, so a changed profile would otherwise restore a cache no build reuses.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Run mutation tests
        env:
          MUTANTS_SHARD: ${{ matrix.shard }}/4
        run: make mutants
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-report-${{ matrix.shard }}
          path: target/mutants/mutants.out
          if-no-files-found: error
