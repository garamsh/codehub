name: mutants

# Never on pull requests: a run takes hours, so it is split into four shards that run at once.
# A surviving mutant or a timeout fails its shard.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  mutants:
    # Mover: the .github/ owner in CODEOWNERS (@sauce-git) moves this label when a newer versioned label is published.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Record runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mover: Dependabot's github-actions updates (.github/dependabot.yml) for the action; the
      # .github/ owner in CODEOWNERS (@sauce-git) for the cargo-mutants version, which the action
      # checks against the checksum it records. nextest is installed at its latest, as in ci.yml.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest,cargo-mutants@27.1.0
      - name: Run mutation tests
        env:
          MUTANTS_SHARD: ${{ matrix.shard }}/4
        run: make mutants
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-report-${{ matrix.shard }}
          path: target/mutants/mutants.out
          if-no-files-found: error
