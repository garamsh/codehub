name: ci

on:
  pull_request:
  push:
    branches: [main, "goal/**"]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Mover: the .github/ owner in CODEOWNERS (@sauce-git) moves this label when a newer versioned label is published.
    runs-on: ubuntu-24.04
    steps:
      - name: Record runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mover: Dependabot's github-actions updates (.github/dependabot.yml), merged by the PM. The
      # tool is installed at its latest version with the action's checksum check; nextest prints
      # its version in every run, and .config/nextest.toml sets the oldest accepted.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      # Mover: Dependabot's github-actions updates (.github/dependabot.yml), merged by the PM. The
      # action's own key holds runner OS, the job, rustc's version (from rust-toolchain.toml) and a
      # hash of the dependency sections of every Cargo.toml, Cargo.lock and rust-toolchain file, so a
      # changed lockfile or toolchain starts a cache of its own and a stale build cannot mask a
      # failure. It does not hash the profiles, so the root manifest is added whole: a changed
      # profile otherwise restores a cache whose artifacts no build reuses and, as the key then
      # hits, is never saved again.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Run checks
        run: make ci
