name: garam-e2e

# Runs `make e2e-garam` against garam's images, which only the garam-e2e environment may pull:
# the pull role's trust policy admits only that environment's subject of this repository. Action
# pins take the form ci.yml states.
on:
  pull_request:
  push:
    branches: [main, "goal/**"]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Role of aurora#780: read access on garam/server and garam/policy only, audience sts.amazonaws.com.
  AWS_ROLE: arn:aws:iam::486152169996:role/github-actions-codehub-pull
  AWS_REGION: ap-northeast-2

jobs:
  garam-e2e:
    # Mover: the .github/ owner in CODEOWNERS (@sauce-git) moves this label when a newer versioned label is published.
    runs-on: ubuntu-24.04
    environment: garam-e2e
    permissions:
      # A job's block replaces the workflow's, so the checkout's read is written beside the
      # federated pull credential.
      contents: read
      id-token: write
    steps:
      - name: Record runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Mover: Dependabot's github-actions updates (.github/dependabot.yml), merged by the PM.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Pull garam's images
        run: docker compose --env-file dev/test.env --profile garam pull --policy missing migrate policy-migrate

      - name: Run the garam end-to-end test
        run: make e2e-garam
